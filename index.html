/* ============================================================
   SCHEDULE ENGINE
   ============================================================ */

function getScheduleInfo() {

  const now = new Date();

  const open =
    MENU_SCHEDULE.find(schedule => {

      const opens =
        new Date(schedule.orderOpens);

      const closes =
        new Date(schedule.orderCloses);

      return now >= opens && now < closes;

    });


  if (open) {

    return {
      status: "open",
      schedule: open
    };

  }


  /*
   * Find the nearest future schedule.
   */

  const next =
    MENU_SCHEDULE

      .filter(schedule =>
        new Date(schedule.orderOpens) > now
      )

      .sort((a, b) =>
        new Date(a.orderOpens) -
        new Date(b.orderOpens)
      )[0];


  if (next) {

    return {
      status: "upcoming",
      schedule: next
    };

  }


  /*
   * Nothing active and nothing upcoming.
   */

  return {
    status: "closed",
    schedule: null
  };

}


/* ============================================================
   FULFILMENT DATE
   ============================================================ */

function getSelectedFulfilmentDate(schedule) {

  const dates =
    schedule.fulfilmentDates ||
    (
      schedule.fulfilmentDate
        ? [schedule.fulfilmentDate]
        : []
    );


  if (!dates.length) {
    return "";
  }


  if (
    !state.selectedFulfilmentDate ||
    !dates.includes(
      state.selectedFulfilmentDate
    )
  ) {

    state.selectedFulfilmentDate =
      dates[0];

  }


  return state.selectedFulfilmentDate;

}

        Please select your preferred order day.
      </div>


      <div
        class="radio-group"
        style="flex-wrap:wrap"
      >

        ${dates.map(date => `

          <label
            class="radio-option"
            style="
              border:1px solid #d1d5db;
              border-radius:7px;
              padding:10px 12px;
              background:white

          >

            <input
              type="radio"
              name="fulfilmentDate"
              value="${esc(date)}"
              ${
                getSelectedFulfilmentDate(schedule) === date
                  ? "checked"
                  : ""
              }
              ${
                !isOpen
                  ? "disabled"
                  : ""
              }
            >

            <span>

/* ============================================================
   UTILITIES
   ============================================================ */

function money(n) {

  return (
    STORE_CONFIG.currency +
    Number(n).toFixed(2)
  );

}


function formatDateTime(value) {

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      dateStyle: "medium",
      timeStyle: "short",
      timeZone: "Asia/Singapore"
    }
  ).format(new Date(value));

}


function formatDate(value) {

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      dateStyle: "full",
      timeZone: "Asia/Singapore"
    }
  ).format(
    new Date(
      value + "T12:00:00+08:00"
    )
  );

}


function saveCustomer() {

  try {

    localStorage.setItem(
      "vietnameseDelightsCustomer",
      JSON.stringify(state.customer)
    );

  } catch (e) {}

}


function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c])
    );

}


function isChilliProduct(id) {

  return (
    id === "bowls-addon-chilli" ||
    id === "addon-chilli"
  );

}


function getTotalChilliInCart() {

  return state.cart.reduce(
    (sum, line) => {

      return isChilliProduct(
        line.productId
      )
        ? sum + line.quantity
        : sum;

    },
    0
  );

}


/* ============================================================
   TOTALS
   ============================================================ */

function calculateTotals() {

  const subtotal =
    state.cart.reduce(
      (s, line) =>
        s + line.total,
      0
    );


  let deliveryFee = 0;

  let isDeliveryTBA = false;


  if (
    state.fulfillmentType === "delivery" &&
    subtotal > 0
  ) {

    if (
      subtotal >=
      STORE_CONFIG.flatDeliveryThreshold
    ) {

      deliveryFee =
        STORE_CONFIG.flatDeliveryFee;

      isDeliveryTBA = false;

    } else {

      deliveryFee = 0;

      isDeliveryTBA = true;

    }

  }


  const grandTotal =
    subtotal + deliveryFee;


  return {
    subtotal,
    deliveryFee,
    isDeliveryTBA,
    grandTotal
  };

}


/* ============================================================
   MAIN RENDER
   ============================================================ */

function render() {

  state.scheduleInfo =
    getScheduleInfo();


  if (
    state.scheduleInfo.schedule
  ) {

    getSelectedFulfilmentDate(
      state.scheduleInfo.schedule
    );

  }


  const root =
    document.getElementById("app");


  /*
   * ACTIVE MENU
   */

  if (
    state.scheduleInfo.status === "open" &&
    state.scheduleInfo.schedule
  ) {

    renderOrderingPage();

    return;

  }


  /*
   * FUTURE MENU
   */

  if (
    state.scheduleInfo.status === "upcoming" &&
    state.scheduleInfo.schedule
  ) {

    root.innerHTML =
      closedPage(
        state.scheduleInfo.schedule
      );

    return;

  }


  /*
   * NOTHING SCHEDULED
   */

  root.innerHTML =
    noUpcomingSalesPage();

}

/* ============================================================
   ADD SIMPLE PRODUCT
   ============================================================ */

function addSimple(product) {

  if (
    isChilliProduct(product.id)
  ) {

    const currentChilliCount =
      getTotalChilliInCart();


    if (
      currentChilliCount >=
      CHILLI_ORDER_LIMIT
    ) {

      alert(
        `Sorry, you can only order a maximum of ${CHILLI_ORDER_LIMIT} chilli bottle(s) per order.`
      );

      return;

    }

  }


  const existingLine =
    state.cart.find(line =>

      line.productId === product.id &&

      line.proteins.length === 0 &&

      line.addOns.length === 0 &&

      line.exclusions.length === 0

    );


  if (existingLine) {

    updateQuantity(
      existingLine.lineId,
      1
    );

    return;

  }


  state.cart.push({

    lineId:
      Date.now() +
      "-" +
      Math.random(),

    productId:
      product.id,

    productName:
      product.name,

    basePrice:
      product.price,

    proteins: [],

    addOns: [],

    exclusions: [],

    quantity: product.id === "pudding-original" ? 2 : 1,

    unitPrice:
      product.price,

    total:
      product.price * (product.id === "pudding-original" ? 2 : 1)

  });


  render();

}


/* ============================================================
   CUSTOMISE
   ============================================================ */

function openCustomize(product) {

  state.customizeProduct =
    product;

  state.selectedProteins = [];

  state.selectedAddOns = [];

  state.selectedExclusions = [];

  render();

}


/* ============================================================
   CONFIRM CUSTOMISATION
   ============================================================ */

function confirmCustomize() {

  const product =
    state.customizeProduct;


  const unit =
    product.price +

    state.selectedProteins
      .reduce(
        (s, x) =>
          s + x.price,
        0
      ) +

    state.selectedAddOns
      .reduce(
        (s, x) =>
          s + x.price,
        0
      );


  state.cart.push({

    lineId:
      Date.now() +
      "-" +
      Math.random(),

    productId:
      product.id,

    productName:
      product.name,

    basePrice:
      product.price,

    proteins:
      [...state.selectedProteins],

    addOns:
      [...state.selectedAddOns],

    exclusions:
      [...state.selectedExclusions],

    quantity: 1,

    unitPrice:
      unit,

    total:
      unit

  });


  state.customizeProduct = null;

  state.selectedProteins = [];

  state.selectedAddOns = [];

  state.selectedExclusions = [];

  state.cartOpen = true;

  render();

}


/* ============================================================
   TOGGLE CHOICES
   ============================================================ */

function toggleChoice(
  collection,
  item
) {

  const exists =
    collection.some(
      x => x.id === item.id
    );


  return exists

    ? collection.filter(
        x => x.id !== item.id
      )

    : [
        ...collection,
        item
      ];

}


/* ============================================================
   EXCLUSIONS
   ============================================================ */

function toggleExclusion(val) {

  if (
    state.selectedExclusions
      .includes(val)
  ) {

    state.selectedExclusions =
      state.selectedExclusions
        .filter(
          x => x !== val
        );

  } else {

    state.selectedExclusions
      .push(val);

  }

}


/* ============================================================
   QUANTITY
   ============================================================ */

function updateQuantity(
  lineId,
  delta
) {

  state.cart =
    state.cart

      .map(line => {

        if (
          line.lineId !== lineId
        ) {

          return line;

        }


        if (
          delta > 0 &&
          isChilliProduct(
            line.productId
          )
        ) {

          const currentChilliCount =
            getTotalChilliInCart();


          if (
            currentChilliCount >=
            CHILLI_ORDER_LIMIT
          ) {

            alert(
              `Sorry, you can only order a maximum of ${CHILLI_ORDER_LIMIT} chilli bottle(s) per order.`
            );

            return line;

          }

        }


        // Puddings are sold in a minimum of two bowls per order.
        const nextQuantity = line.quantity + delta;
        const quantity = line.productId === "pudding-original" && nextQuantity === 1
          ? (delta < 0 ? 0 : 2)
          : Math.max(0, nextQuantity);


        return {

          ...line,

          quantity,

          total:
            quantity *
            line.unitPrice

        };

      })

      .filter(
        line =>
          line.quantity > 0
      );


  render();

}


/* ============================================================
   SUBMIT ORDER
   ============================================================ */

function submitOrder() {

  state.customer.name =
    document
      .getElementById("name")
      ?.value
      .trim() || "";


  state.customer.phone =
    document
      .getElementById("phone")
      ?.value
      .trim() || "";


  state.customer.address =
    document
      .getElementById("address")
      ?.value
      .trim() || "";


  state.customer.notes =
    document
      .getElementById("notes")
      ?.value
      .trim() || "";


  saveCustomer();


  const info =
    getScheduleInfo();


  if (
    info.status !== "open"
  ) {

    alert(
      "Ordering is currently closed."
    );

    render();

    return;

  }


  if (
    !state.cart.length
  ) {

    alert(
      "Please add at least one item."
    );

    return;

  }


  const puddingQuantity = state.cart
    .filter(line => line.productId === "pudding-original")
    .reduce((sum, line) => sum + line.quantity, 0);

  if (puddingQuantity === 1) {
    alert("Original pudding has a minimum order of 2 bowls.");
    return;
  }

  if (
    !state.customer.name ||
    !state.customer.phone
  ) {

    alert(
      "Please enter your name and phone number."
    );

    return;

  }


  if (
    state.fulfillmentType === "delivery" &&
    !state.customer.address
  ) {

    alert(
      "Please enter your delivery address."
    );

    return;

  }


  const schedule =
    info.schedule;


  const selectedFulfilmentDate =
    getSelectedFulfilmentDate(
      schedule
    );


  if (
    !selectedFulfilmentDate
  ) {

    alert(
      "Please select a fulfilment date."
    );

    return;

  }


  const menu =
    MENUS[schedule.menuId];


  const {
    subtotal,
    deliveryFee,
    isDeliveryTBA,
    grandTotal
  } =
    calculateTotals();


  const itemsText =
    state.cart

      .map(line => {

        let itemStr =
          `${line.productName} x${line.quantity} (${money(line.total)})`;


        if (
          line.proteins.length
        ) {

          itemStr +=
            ` [Protein: ${line.proteins
              .map(x => x.name)
              .join(" + ")}]`;

        }


        if (
          line.exclusions.length
        ) {

          itemStr +=
            ` [Exclusions: ${line.exclusions
              .join(", ")}]`;

        }


        if (
          line.addOns.length
        ) {

          itemStr +=
            ` [Add-ons: ${line.addOns
              .map(x => x.name)
              .join(", ")}]`;

        }


        return itemStr;

      })

      .join("\n");


  const timeLabel =
    state.deliveryTime === "12pm"
      ? "12:00 PM (Lunch)"
      : "6:00 PM (Dinner)";


  const locationLabel =
    state.fulfillmentType === "delivery"
      ? state.customer.address
      : STORE_CONFIG.pickupLocation;


  /*
   * Google Sheets payload
   */

  const sheetData = {

    menuTitle:
      menu.title,

    fulfilmentDate:
      selectedFulfilmentDate,

    customerName:
      state.customer.name,

    customerPhone:
      state.customer.phone,

    deliveryTime:
      timeLabel,

    fulfillmentType:
      state.fulfillmentType === "delivery"
        ? "Delivery"
        : "Self-Collection",

    customerAddress:
      locationLabel,

    customerNotes:
      state.customer.notes,

    orderDetails:
      itemsText,

    subtotal:
      money(subtotal),

    deliveryFee:
      state.fulfillmentType === "delivery"

        ? (
            isDeliveryTBA
              ? "TBA"
              : money(deliveryFee)
          )

        : "$0.00",

    totalAmount:
      money(grandTotal) +
      (
        isDeliveryTBA
          ? " + Delivery"
          : ""
      )

  };


  /*
   * Send order to Google Apps Script.
   */

  if (
    STORE_CONFIG.googleSheetUrl
  ) {

    fetch(
      STORE_CONFIG.googleSheetUrl,
      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            sheetData
          )

      }

    ).catch(
      err =>
        console.error(
          "Sheet error:",
          err
        )
    );

  }


  /*
   * WhatsApp order message
   */

  let text =
    `*NEW ORDER - ${menu.title.toUpperCase()}*\n\n`;


  text +=
    `*Fulfilment:* ${formatDate(
      selectedFulfilmentDate
    )}\n`;


  text +=
    `*Time Slot:* ${timeLabel}\n`;


  text +=
    `*Method:* ${
      state.fulfillmentType === "delivery"
        ? "Delivery"
        : "Self-Collection"
    }\n`;


  text +=
    `*Customer:* ${
      state.customer.name
    }\n`;


  text +=
    `*Phone:* ${
      state.customer.phone
    }\n`;


  text +=
    `*${
      state.fulfillmentType === "delivery"
        ? "Delivery Address"
        : "Collection Point"
    }:* ${locationLabel}\n`;


  if (
    state.customer.notes
  ) {

    text +=
      `*General Remarks:* ${
        state.customer.notes
      }\n`;

  }


  text +=
    `\n*--- ORDER ITEMS ---*\n`;


  state.cart.forEach(
    line => {

      text +=
        `• ${line.productName} x${line.quantity} - ${money(line.total)}\n`;


      if (
        line.proteins.length
      ) {

        text +=
          `   Protein mix: ${
            line.proteins
              .map(x => x.name)
              .join(" + ")
          }\n`;

      }


      if (
        line.exclusions.length
      ) {

        text +=
          `   Exclusions: ${
            line.exclusions
              .join(", ")
          }\n`;

      }


      if (
        line.addOns.length
      ) {

        text +=
          `   Add-ons: ${
            line.addOns
              .map(x => x.name)
              .join(", ")
          }\n`;

      }

    }
  );


  text +=
    `\n*Subtotal:* ${
      money(subtotal)
    }\n`;


  if (
    state.fulfillmentType === "delivery"
  ) {

    if (
      isDeliveryTBA
    ) {

      text +=
        `*Delivery Fee:* TBA (Advised via reply based on driver quote)\n`;

      text +=
        `*ESTIMATED TOTAL:* ${
          money(subtotal)
        } + delivery fee\n`;

    } else {

      text +=
        `*Delivery Fee:* ${
          money(deliveryFee)
        } (Flat Rate)\n`;

      text +=
        `*TOTAL PAYABLE:* ${
          money(grandTotal)
        }\n`;

    }

  } else {

    text +=
      `*Delivery Fee:* $0.00 (Self-Collection)\n`;

    text +=
      `*TOTAL PAYABLE:* ${
        money(grandTotal)
      }\n`;

  }


  text +=
    `\n*Payment via PayNow:* ${
      STORE_CONFIG.paynowDetails
    }\n`;


  window.open(
    `https://wa.me/${
      STORE_CONFIG.whatsappNumber
    }?text=${
      encodeURIComponent(text)
    }`,
    "_blank"
  );

}


/* ============================================================
   EVENT BINDING
   ============================================================ */

function bindEvents(
  menu,
  isOpen
) {


  document
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(el => {

      el.addEventListener(
        "click",
        () => {

          const action =
            el.dataset.action;


          if (
            action === "simple"
          ) {

            const p =
              menu.products.find(
                x =>
                  x.id ===
                  el.dataset.id
              );


            if (
              p &&
              isOpen
            ) {

              addSimple(p);

            }

          }


          if (
            action === "menu-qty"
          ) {

            const productId =
              el.dataset.id;

            const delta =
              Number(
                el.dataset.delta
              );


            if (
              delta > 0
            ) {

              const product =
                menu.products.find(
                  p =>
                    p.id ===
                    productId
                );


              if (
                product &&
                isOpen
              ) {

                addSimple(product);

              }

            } else {

              const line =
                state.cart.find(
                  l =>
                    l.productId ===
                      productId &&

                    l.proteins.length === 0 &&

                    l.addOns.length === 0 &&

                    l.exclusions.length === 0
                )
                ||
                state.cart.find(
                  l =>
                    l.productId ===
                    productId
                );


              if (line) {

                updateQuantity(
                  line.lineId,
                  -1
                );

              }

            }

          }


          if (
            action === "customize"
          ) {

            const p =
              menu.products.find(
                x =>
                  x.id ===
                  el.dataset.id
              );


            if (
              p &&
              isOpen
            ) {

              openCustomize(p);

            }

          }


          if (
            action === "close-modal"
          ) {

            state.customizeProduct =
              null;

            render();

          }


          if (
            action === "protein"
          ) {

            const p =
              [

                {
                  id: "pork",
                  name: "Grilled Pork",
                  price: 0
                },

                {
                  id: "chicken",
                  name: "Grilled Chicken",
                  price: 0
                },

                {
                  id: "meatball",
                  name: "Pork Meatball",
                  price: 0
                },

                {
                  id: "duck",
                  name: "Smoked Duck",
                  price: 0
                }

              ]

              .find(
                x =>
                  x.id ===
                  el.dataset.id
              );


            if (p) {

              state.selectedProteins =
                toggleChoice(
                  state.selectedProteins,
                  p
                );

              render();

            }

          }


          if (
            action === "exclusion"
          ) {

            toggleExclusion(
              el.dataset.val
            );

            render();

          }


          if (
            action === "addon"
          ) {

            const a =
              menu.addOns.find(
                x =>
                  x.id ===
                  el.dataset.id
              );


            if (a) {

              state.selectedAddOns =
                toggleChoice(
                  state.selectedAddOns,
                  a
                );

              render();

            }

          }


          if (
            action === "confirm-custom"
          ) {

            confirmCustomize();

          }


          if (
            action === "toggle-cart"
          ) {

            state.cartOpen =
              !state.cartOpen;

            render();

          }


          if (
            action === "remove"
          ) {

            state.cart =
              state.cart.filter(
                x =>
                  x.lineId !==
                  el.dataset.line
              );

            render();

          }


          if (
            action === "qty"
          ) {

            updateQuantity(
              el.dataset.line,
              Number(
                el.dataset.delta
              )
            );

          }


          if (
            action === "submit"
          ) {

            submitOrder();

          }

        }
      );

    });


  /*
   * Fulfilment date
   */

  document
    .querySelectorAll(
      'input[name="fulfilmentDate"]'
    )
    .forEach(radio => {

      radio.addEventListener(
        "change",
        e => {

          state.selectedFulfilmentDate =
            e.target.value;

        }
      );

    });


  /*
   * Fulfilment method
   */

  document
    .querySelectorAll(
      'input[name="fulfillment"]'
    )
    .forEach(radio => {

      radio.addEventListener(
        "change",
        e => {

          state.fulfillmentType =
            e.target.value;

          render();

        }
      );

    });


  /*
   * Meal time
   */

  document
    .querySelectorAll(
      'input[name="deliveryTime"]'
    )
    .forEach(radio => {

      radio.addEventListener(
        "change",
        e => {

          state.deliveryTime =
            e.target.value;

        }
      );

    });


  /*
   * Save only the useful customer details.
   */

  [
    "name",
    "phone",
    "address",
    "notes"
  ]
  .forEach(id => {

    const input =
      document.getElementById(id);


    if (!input) {
      return;
    }


    input.addEventListener(
      "input",
      () => {

        state.customer[id] =
          input.value;

        saveCustomer();

      }
    );

  });

}


/* ============================================================
   ERROR HANDLER
   ============================================================ */

window.addEventListener(
  "error",
  function(e) {

    const app =
      document.getElementById("app");


    if (
      app &&
      (
        !app.innerHTML.trim() ||
        app.innerHTML.includes(
          "The order page could not load"
        )
      )
    ) {

      app.innerHTML =
        errorPage(
          "The order page could not load",
          e.message ||
          "A JavaScript error occurred."
        );

    }

  }
);


/* ============================================================
   INITIAL LOAD
   ============================================================ */

render();


/* ============================================================
   AUTOMATIC SCHEDULE REFRESH
   ============================================================

   This allows the page to automatically move from:

   OPEN
      ↓
   CLOSED / NEXT MENU
      ↓
   CLOSED / NO UPCOMING SALES

   without the customer needing to refresh.

   ============================================================ */

setInterval(
  () => {

    const activeEl =
      document.activeElement;


    const isTyping =
      activeEl &&
      (
        activeEl.tagName === "INPUT" ||
        activeEl.tagName === "TEXTAREA"
      );


    if (
      !isTyping &&
      !state.customizeProduct
    ) {

      render();

    }

  },
  30000
);

</script>
